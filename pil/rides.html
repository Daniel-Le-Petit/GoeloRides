<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sorties – GoëloRides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/pil.css" />
</head>

<body>
  <div class="dashboard">

    <header class="header">
      <div class="brand">GoëloRides</div>
      <div class="team-pill">🚴‍♂️ Sorties</div>
      <div class="user-avatar">Do</div>
    </header>

    <main class="main">

      <section class="card">
        <h2>Créer une nouvelle sortie</h2>

        <form id="create-ride-form" class="form-grid">

          <div class="form-field">
            <label>Nom de la sortie</label>
            <input type="text" name="track_name" required />
          </div>

          <div class="form-field">
            <label>Groupe</label>
            <select name="group_label">
              <option value="White">White</option>
              <option value="Green">Green</option>
              <option value="Blue">Blue</option>
              <option value="Red">Red</option>
            </select>
          </div>

          <div class="form-field">
            <label>Type</label>
            <select name="route_kind">
              <option value="road">Route</option>
              <option value="gravel">Gravel</option>
              <option value="mtb">VTT</option>
            </select>
          </div>

          <div class="form-field">
            <label>Rythme</label>
            <input type="text" name="pace_label" placeholder="Ex : 25 km/h" />
          </div>

          <div class="form-field">
            <label>Ordre</label>
            <input type="number" name="sort_order" value="10" />
          </div>

          <div class="form-field">
            <label>
              <input type="checkbox" name="is_active" checked />
              Publiée
            </label>
          </div>

          <button class="btn primary" type="submit">Créer</button>
        </form>
      </section>

      <section class="card">
        <h2>Liste des sorties</h2>
        <div id="rides-list" class="list"></div>
      </section>

    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/pilapp.js"></script>
  <script src="js/rides.js"></script>
</body>
</html>
