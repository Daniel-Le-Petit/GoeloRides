<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mes inscriptions aux sorties GoëloRides.">
  <meta name="theme-color" content="#0d1820">
  <title>Mes inscriptions · GoëloRides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/account.css">

<link rel="stylesheet" href="css/components/back-navigation.css">
  <link rel="stylesheet" href="css/components/brand.css?v=20261030-footer">
</head>
<body>
  <div data-goelo-navbar data-goelo-navbar-active="bookings"></div>

  <header class="gr-page-header">
    <h1>Mes inscriptions</h1>
    <p>Les sorties auxquelles tu es inscrit·e.</p>
  </header>

  <main class="ac-main" id="main-content" role="main">
    <nav class="ac-account-nav" aria-label="Mon espace">
      <a href="profile.html" >Mon profil</a>
      <a href="my-bookings.html" aria-current="page">Mes inscriptions</a>
    </nav>

    <div id="bookings-gate" class="ac-gate" hidden>
      <h2>Connexion requise</h2>
      <p>Connecte-toi pour voir tes inscriptions.</p>
      <button type="button" class="ac-gate__btn" data-goelo-auth-trigger>Se connecter</button>
    </div>

    <div id="bookings-fatal" class="ac-error" role="alert" hidden></div>

    <section class="ac-card" id="bookings-content" hidden>
      <div class="ac-section-head"><h2>Mon agenda vélo</h2><a class="ac-btn" href="sorties.html">Découvrir les sorties</a></div>
      <div class="ac-filters" role="group" aria-label="Période des inscriptions"><button type="button" data-period="upcoming" aria-pressed="true">À venir <span id="count-upcoming">0</span></button><button type="button" data-period="past" aria-pressed="false">Passées <span id="count-past">0</span></button></div>
      <p id="bookings-feedback" role="status" aria-live="polite"></p>
      <div id="bookings-list"></div>
    </section>

  </main>

  <script src="js/goelo-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/goelo-auth-state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/goelo-profile.js"></script>
  <script src="js/goelo-ui.js"></script>
  <script src="js/goelo-navbar.js"></script>
  <script src="js/goelo-sortie-dates.js"></script>
  <script src="js/my-bookings.js"></script>
<script src="js/goelo-back-navigation.js" defer></script>
</body>
</html>
