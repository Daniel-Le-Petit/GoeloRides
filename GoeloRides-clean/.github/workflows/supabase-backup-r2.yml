# Sauvegarde quotidienne Supabase → Cloudflare R2 (bucket privé, API S3).
# Secrets GitHub (Settings → Secrets → Actions) :
#   SUPABASE_DATABASE_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
# Optionnel : R2_PREFIX (sinon défaut backups/goelorides-)
#
# Rétention 7 jours : règle Lifecycle sur le bucket R2 (voir supabase/BACKUP-R2.md).

name: Supabase backup → R2

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-backup-r2
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump & upload to R2
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: bash scripts/backup-supabase-r2.sh
