name: Ajouter la sortie GoëloRides 5
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261102130000_goelorides_5_ports.sql'
      - '.github/workflows/goelorides-5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goelorides-5-migration
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter la sortie et vérifier sa présence
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DATABASE_URL:-}"
          export PGCONNECT_TIMEOUT=15
          psql "$SUPABASE_DATABASE_URL" -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261102130000_goelorides_5_ports.sql
          psql "$SUPABASE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT track_name || ' · ' || (front_config->>'rideDateIso') FROM public.routes WHERE is_active AND front_config->>'rideDateIso' = '2026-07-28' AND track_name = 'GoëloRides #5 - La boucle des ports du Goëlo';"
