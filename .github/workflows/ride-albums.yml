name: Albums photos — migration Supabase
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261101190000_ride_albums.sql'
      - 'goelorides-tests/tests/integration/ride-albums-postgres.cjs'
      - '.github/workflows/ride-albums.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261101190000_ride_albums.sql'
      - 'goelorides-tests/tests/integration/ride-albums-postgres.cjs'
      - '.github/workflows/ride-albums.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ride-albums-migration
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: goelo_alerts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests de migration sur PostgreSQL isolé
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: goelo_alerts_test
          PGUSER: postgres
          PGPASSWORD: local_test_only
        run: node goelorides-tests/tests/integration/ride-albums-postgres.cjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la migration des albums photos dans une transaction
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo 'Secret GitHub SUPABASE_DATABASE_URL manquant.'
            exit 1
          fi
          export PGCONNECT_TIMEOUT=15
          psql "$SUPABASE_DATABASE_URL" -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261101190000_ride_albums.sql
          psql "$SUPABASE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "SELECT 'ride_albums disponible : ' || (to_regclass('public.ride_albums') IS NOT NULL);"
