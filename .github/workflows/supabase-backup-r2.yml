# Sauvegarde quotidienne Supabase → Cloudflare R2 (bucket privé, API S3).
# Secrets GitHub (Settings → Secrets → Actions) :
#   SUPABASE_DATABASE_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
# Optionnel : R2_PREFIX (sinon défaut backups/goelorides-)

name: Supabase backup → R2

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-backup-r2
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release ca-certificates

          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/postgresql-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update

          sudo apt-get install -y postgresql-client-17

      - name: Check PostgreSQL versions
        run: |
          echo "Installed PostgreSQL binaries:"
          ls -la /usr/lib/postgresql/

          echo "pg_dump default:"
          which pg_dump
          pg_dump --version

          echo "pg_dump PostgreSQL 17:"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Configure PostgreSQL 17 as default
        run: |
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Verify pg_dump after PATH update
        run: |
          pg_dump --version


      - name: Dump & upload to R2
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          bash scripts/backup-supabase-r2.sh

