name: Accès au guide de niveau de la sortie
on:
  pull_request:
    paths:
      - 'parcours.html'
      - 'js/parcours.js'
      - 'js/goelo-calendar.js'
      - 'goelorides-tests/tests/unit/ride-calendar.test.cjs'
      - 'goelorides-tests/tests/integration/ride-actions-browser.cjs'
      - 'css/pages/parcours.css'
      - 'goelorides-tests/tests/unit/ride-level-shortcut.test.cjs'
      - '.github/workflows/ride-level-shortcut.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test goelorides-tests/tests/unit/ride-calendar.test.cjs goelorides-tests/tests/unit/ride-level-shortcut.test.cjs goelorides-tests/tests/unit/activity-registration.test.cjs goelorides-tests/tests/unit/guest-pseudo*.test.cjs

      - run: npm ci --prefix goelorides-tests
      - run: node goelorides-tests/node_modules/playwright/cli.js install --with-deps chromium
      - run: node goelorides-tests/tests/integration/ride-actions-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ride-actions-mobile
          path: /tmp/ride-actions-mobile.png
