# Static site — no build. All files in repo root are published as-is.
# https://render.com/docs/static-sites
#
# Déploiement : pousse bien la dernière branche (Render suit Git). Inclure favicon.ico
# à la racine du dépôt (git add favicon.ico) pour supprimer le 404 sur GET /favicon.ico.
services:
  - type: web
    name: goelo-rides
    runtime: static
    staticPublishPath: .
