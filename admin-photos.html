<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albums photos · Admin GoëloRides</title><link rel="stylesheet" href="css/pages/ride-gallery.css?v=20261101"><style>body{margin:0;background:#eef2f6;color:#15232d;font:16px/1.5 system-ui,sans-serif}a{color:#1565a8}h1{line-height:1.2}</style></head><body><main class="album-admin"><a href="admin.html">← Panneau admin</a><h1>Photos des sorties</h1><p>Crée un album par sortie, ajoute tes photos puis publie-le dans la galerie.</p><p><a href="dans-la-roue.html">Voir la galerie →</a></p><p id="album-status" role="status" aria-live="polite">Vérification de l’accès…</p><button id="album-retry" type="button" hidden>Réessayer</button><section id="album-workspace" hidden><h2>Les albums</h2><div id="album-list"></div><button id="album-new" type="button">+ Nouvel album</button><h2 id="album-form-title">Nouvel album</h2><form id="album-form"><label>Sortie associée (facultatif)<select id="album-route"><option value="">Sans association</option></select></label><label>Titre<input id="album-title" required maxlength="180"></label><label>Date de la sortie<input id="album-date" type="date" required></label><label>Quelques mots sur la sortie<textarea id="album-description" maxlength="1500" rows="3"></textarea></label><label>Publication Facebook (facultatif)<input id="album-facebook" type="url" placeholder="https://www.facebook.com/…"></label><label>Ajouter des photos<input id="album-files" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>JPG, PNG ou WebP · 40 photos maximum par album. Les photos seront redimensionnées pour le web. Sur iPhone, exporte les photos HEIC en JPG.</small></label><div id="album-preview" class="preview"></div><label class="check"><input id="album-consent" type="checkbox" required>Je dispose de l’accord nécessaire pour diffuser ces photos.</label><label class="check"><input id="album-published" type="checkbox">Afficher cet album dans la galerie publique</label><small>Les fichiers téléversés ont une adresse publique. Le brouillon masque l’album dans la galerie.</small><div class="actions"><button type="submit" id="album-save">Enregistrer l’album</button><button type="button" id="album-reset">Nouvel album</button></div></form></section></main><script src="js/goelo-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/goelo-auth-state.js"></script><script src="js/auth.js"></script><script src="js/admin-photos.js?v=20261101"></script></body></html>
